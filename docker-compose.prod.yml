version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rootcausex-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rootcausex}
      POSTGRES_USER: ${POSTGRES_USER:-rootcausex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rootcausex_secure_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rootcausex} -d ${POSTGRES_DB:-rootcausex}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis 7 In-Memory Cache
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: rootcausex-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # RootCauseX Unified Full-Stack Application (Backend + Frontend)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rootcausex-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rootcausex}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rootcausex}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-rootcausex_secure_pass_2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_API_KEY: ${AI_API_KEY:-mock-key}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      AI_MOCK_MODE: ${AI_MOCK_MODE:-auto}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgvector_data:
  redis_data:
