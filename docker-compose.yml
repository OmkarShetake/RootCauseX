version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rootcausex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rootcausex
      POSTGRES_USER: rootcausex
      POSTGRES_PASSWORD: rootcausex_password
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootcausex -d rootcausex"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rootcausex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
  redis_data:
